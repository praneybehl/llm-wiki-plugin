name: Wiki checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install PyYAML==6.0.3 fastembed==0.8.0 sqlite-vec==0.1.9
      - run: python -m unittest discover -s eval/retrieval -p 'test_*.py'
      - run: python skills/llm-wiki/scripts/test_link_resolution.py
      - run: python eval/evolution/test_evolution.py
      - run: python eval/evolution/test_loop.py
      - run: python eval/retrieval/run_eval.py --gate
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
