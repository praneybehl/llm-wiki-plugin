name: paperclip-plugin

on:
  push:
    branches: [main]
    paths:
      - "integrations/paperclip/**"
      - ".github/workflows/paperclip-plugin.yml"
  pull_request:
    paths:
      - "integrations/paperclip/**"
      - ".github/workflows/paperclip-plugin.yml"

defaults:
  run:
    working-directory: integrations/paperclip/plugin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: integrations/paperclip/plugin/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm run build

      - name: Verify dist/ is in the publish tarball
        run: |
          pnpm exec npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          for entry in dist/manifest.js dist/worker.js dist/ui/index.js; do
            if ! grep -q "$entry" /tmp/pack-output.txt; then
              echo "::error::missing $entry in publish tarball"
              exit 1
            fi
          done
